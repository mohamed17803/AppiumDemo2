name: Appium Android Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Appium + UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --version

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-${{ runner.os }}

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Start Appium server
        run: |
          appium --address 127.0.0.1 --port 4723 --use-drivers uiautomator2 --log appium-server.log &
          npx --yes wait-on http://127.0.0.1:4723/status --timeout 120000

      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PLATFORM_NAME: Android
          PLATFORM_VERSION: "14"
          DEVICE_NAME: emulator-5554
          APPIUM_SERVER_URL: http://127.0.0.1:4723
          AUTO_START_APPIUM_SERVER: "false"
          EXPLICIT_WAIT_SECONDS: "45"
          POLLING_MILLIS: "500"
          MAX_RETRIES: "2"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: mvn -B test -DsuiteXmlFile=src/test/resources/XMLSuites/RunAllTests.xml

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report
        continue-on-error: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            target/allure-results
            target/allure-report
            logs/
            appium-server.log
          if-no-files-found: warn
